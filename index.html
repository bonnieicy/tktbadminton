<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏸 Badminton Social Event Manager</title>
    
    <!-- Firebase SDK -->

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    </style>
</head>

<script>
// ============================================================
// FIREBASE CONFIGURATION
// ============================================================

let firebaseApp = null;
let firebaseDb = null;
let isFirebaseConnected = false;
let syncInProgress = false;

// Default shuttle types
const DEFAULT_SHUTTLE_TYPES = [
    { id: 'shuttle_1', name: 'RSL Ultimate', pricePerTube: 190 },
    { id: 'shuttle_2', name: 'Settled Shuttlecock', pricePerTube: 230 },
    { id: 'shuttle_3', name: 'Other', pricePerTube: 215 }
];

// Default participants
const DEFAULT_PARTICIPANTS = [
    'Bonnie', 'Donald', 'Matthias', 'Marco L', 'Frankie', 
    'Jack', 'Marco C', 'Dickson', 'Samuel Uncle', 'Andy Hin',
    'Frera', 'Hin Jai', 'Samuel', 'Pavis', 'Angelina',
    'Ivan', 'Samuel Bro', 'Bosco', 'Mak', 'Mattias GF',
    'Colin', 'Giselle', 'Chi', 'Vicky', 'Claudia',
    'Donald Frd (Ray)', 'Donald Frd', 'Donald Frd (Uncle)',
    'Titan', 'Andrew', "Andrew' fd", 'Larry', "Marco Y (Jack's fd)", 'Shale'
];

// ============================================================
// DATA LAYER
// ============================================================

let participants = [];
let events = [];
let shuttleTypes = [];
let editingEventId = null;

function getCategory(name) {
    const categories = {
        'Bonnie': 'B', 'Donald': 'B', 'Frankie': 'B', 'Hin Jai': 'B',
        'Samuel': 'B', 'Angelina': 'B', 'Bosco': 'B', 'Mak': 'B',
        'Colin': 'B', 'Chi': 'B', 'Vicky': 'B', 'Claudia': 'B',
        'Matthias': 'M', 'Marco L': 'M', 'Jack': 'M', 'Marco C': 'M',
        'Dickson': 'M', 'Mattias GF': 'M', 'Giselle': 'M'
    };
    return categories[name] || '';
}

function generateId() {
    return 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
}

function getDeviceId() {
    let id = localStorage.getItem('deviceId');
    if (!id) {
        id = 'device_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        localStorage.setItem('deviceId', id);
    }
    return id;
}

// ============================================================
// PERSISTENCE (Local)
// ============================================================

function loadData() {
    try {
        const saved = localStorage.getItem('badmintonData');
        if (saved) {
            const data = JSON.parse(saved);
            participants = data.participants || DEFAULT_PARTICIPANTS.slice();
            events = data.events || [];
            shuttleTypes = data.shuttleTypes || DEFAULT_SHUTTLE_TYPES.slice();
        } else {
            participants = DEFAULT_PARTICIPANTS.slice();
            events = [];
            shuttleTypes = DEFAULT_SHUTTLE_TYPES.slice();
        }
    } catch (e) {
        participants = DEFAULT_PARTICIPANTS.slice();
        events = [];
        shuttleTypes = DEFAULT_SHUTTLE_TYPES.slice();
    }
    saveData();
}

function saveData() {
    localStorage.setItem('badmintonData', JSON.stringify({
        participants: participants,
        events: events,
        shuttleTypes: shuttleTypes
    }));
}

// ============================================================
// FIREBASE FUNCTIONS
// ============================================================

function loadFirebaseConfig() {
    try {
        const saved = localStorage.getItem('firebaseConfig');
        if (saved) {
            const config = JSON.parse(saved);
            document.getElementById('firebaseConfigInput').value = JSON.stringify(config, null, 2);
            return config;
        }
    } catch (e) {
        console.error('Error loading Firebase config:', e);
    }
    return null;
}

function saveFirebaseConfig(config) {
    localStorage.setItem('firebaseConfig', JSON.stringify(config));
}

function configureFirebase() {
    const input = document.getElementById('firebaseConfigInput');
    let config;
    
    try {
        config = JSON.parse(input.value);
    } catch (e) {
        showCloudMessage('Invalid JSON format. Please check your config.', 'error');
        return;
    }
    
    // Validate required fields
    const required = ['apiKey', 'authDomain', 'databaseURL', 'projectId', 'storageBucket', 'messagingSenderId', 'appId'];
    const missing = required.filter(field => !config[field]);
    
    if (missing.length > 0) {
        showCloudMessage('Missing required fields: ' + missing.join(', '), 'error');
        return;
    }
    
    try {
        // Initialize Firebase
        if (firebaseApp) {
            try { firebaseApp.delete(); } catch (e) {}
        }
        
        firebaseApp = firebase.initializeApp(config);
        firebaseDb = firebase.database();
        isFirebaseConnected = true;
        
        saveFirebaseConfig(config);
        updateSyncStatus('synced', 'Connected ☁️');
        showCloudMessage('✅ Firebase connected successfully!', 'success');
        
        // Test connection
        firebaseDb.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === true) {
                updateSyncStatus('synced', 'Online ☁️');
            } else {
                updateSyncStatus('offline', 'Offline 📡');
            }
        });
        
        // Listen for real-time updates
        firebaseDb.ref('badmintonData').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data._lastUpdatedBy && data._lastUpdatedBy !== getDeviceId()) {
                importCloudData(data);
                showCloudMessage('☁️ Synced from cloud!', 'success');
            }
        });
        
        // Load initial data
        loadFromCloud();
        
    } catch (e) {
        showCloudMessage('Firebase error: ' + e.message, 'error');
        updateSyncStatus('error', 'Error ⚠️');
        isFirebaseConnected = false;
    }
}

function disconnectFirebase() {
    if (firebaseApp) {
        try { firebaseApp.delete(); } catch (e) {}
    }
    firebaseApp = null;
    firebaseDb = null;
    isFirebaseConnected = false;
    updateSyncStatus('offline', 'Offline 📡');
    localStorage.removeItem('firebaseConfig');
    document.getElementById('firebaseConfigInput').value = '';
    showCloudMessage('🔌 Disconnected from Firebase', 'info');
}

function updateSyncStatus(status, text) {
    const el = document.getElementById('syncStatus');
    if (el) {
        el.className = 'sync-status ' + status;
        el.textContent = text;
    }
    
    const dot = document.getElementById('cloudStatusDot');
    const statusText = document.getElementById('cloudStatusText');
    if (dot) {
        dot.className = 'status-dot ' + status;
    }
    if (statusText) {
        statusText.textContent = text;
    }
}

function showCloudMessage(message, type) {
    const el = document.getElementById('cloudMessage');
    if (el) {
        el.className = 'message ' + type;
        el.textContent = message;
        el.style.display = 'block';
        setTimeout(() => {
            el.style.display = 'none';
            el.className = 'message';
        }, 5000);
    }
}

function importCloudData(data) {
    if (!data) return;
    
    let changed = false;
    let message = '';
    
    if (data.participants && data.participants.length > 0) {
        participants = data.participants;
        changed = true;
        message += '👥 Participants updated. ';
    }
    
    if (data.events) {
        events = data.events;
        changed = true;
        message += '📊 Events updated. ';
    }
    
    if (data.shuttleTypes && data.shuttleTypes.length > 0) {
        shuttleTypes = data.shuttleTypes;
        changed = true;
        message += '🏸 Shuttle types updated.';
    }
    
    if (changed) {
        saveData();
        refreshAllUI();
        showMessage('saveMessage', '☁️ ' + message, 'success');
    }
}

function syncToCloud() {
    if (!isFirebaseConnected || !firebaseDb) {
        showCloudMessage('Please connect to Firebase first!', 'error');
        return;
    }
    
    if (syncInProgress) {
        showCloudMessage('Sync already in progress...', 'info');
        return;
    }
    
    syncInProgress = true;
    updateSyncStatus('syncing', 'Syncing... 🔄');
    showCloudMessage('☁️ Syncing data to cloud...', 'info');
    
    const data = {
        participants: participants,
        events: events,
        shuttleTypes: shuttleTypes,
        _lastUpdatedBy: getDeviceId(),
        _updatedAt: new Date().toISOString()
    };
    
    firebaseDb.ref('badmintonData').set(data)
        .then(() => {
            syncInProgress = false;
            updateSyncStatus('synced', 'Synced ✓');
            showCloudMessage('✅ Data synced to cloud successfully!', 'success');
        })
        .catch((error) => {
            syncInProgress = false;
            updateSyncStatus('error', 'Sync failed ⚠️');
            showCloudMessage('❌ Sync failed: ' + error.message, 'error');
        });
}

function loadFromCloud() {
    if (!isFirebaseConnected || !firebaseDb) {
        showCloudMessage('Please connect to Firebase first!', 'error');
        return;
    }
    
    updateSyncStatus('syncing', 'Loading... 🔄');
    showCloudMessage('📥 Loading data from cloud...', 'info');
    
    firebaseDb.ref('badmintonData').once('value')
        .then((snapshot) => {
            const data = snapshot.val();
            if (data) {
                importCloudData(data);
                updateSyncStatus('synced', 'Loaded ✓');
                showCloudMessage('✅ Data loaded from cloud successfully!', 'success');
            } else {
                updateSyncStatus('synced', 'No data in cloud');
                showCloudMessage('ℹ️ No data found in cloud.', 'info');
            }
        })
        .catch((error) => {
            updateSyncStatus('error', 'Load failed ⚠️');
            showCloudMessage('❌ Load failed: ' + error.message, 'error');
        });
}

function clearCloudData() {
    if (!isFirebaseConnected || !firebaseDb) {
        showCloudMessage('Please connect to Firebase first!', 'error');
        return;
    }
    
    if (!confirm('⚠️ Delete ALL data from the cloud? This will affect all devices!')) return;
    if (!confirm('Are you absolutely sure?')) return;
    
    firebaseDb.ref('badmintonData').remove()
        .then(() => {
            updateSyncStatus('synced', 'Cleared ✓');
            showCloudMessage('🗑️ Cloud data cleared!', 'info');
        })
        .catch((error) => {
            showCloudMessage('❌ Failed to clear: ' + error.message, 'error');
        });
}

// ============================================================
// UI HELPERS
// ============================================================

function showMessage(elementId, message, type = 'success') {
    const el = document.getElementById(elementId);
    if (!el) return;
    el.className = 'message ' + type;
    el.textContent = message;
    el.style.display = 'block';
    setTimeout(() => { 
        el.style.display = 'none';
        el.className = 'message';
    }, 4000);
}

function formatDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}

function getToday() {
    return new Date().toISOString().split('T')[0];
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function refreshAllUI() {
    renderParticipantList(document.getElementById('participantSearch')?.value || '');
    renderEvents();
    renderParticipantSummary();
    renderEarnings();
    renderSettings();
    renderShuttleSelect();
}

// ============================================================
// TAB SWITCHING
// ============================================================

function showTab(tabName) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
    document.getElementById(tabName).classList.add('active');
    document.querySelector(`.tab[onclick="showTab('${tabName}')"]`).classList.add('active');
    
    if (tabName === 'events') renderEvents();
    if (tabName === 'participants') renderParticipantSummary();
    if (tabName === 'earnings') renderEarnings();
    if (tabName === 'settings') renderSettings();
}

// ============================================================
// SHUTTLE MANAGEMENT
// ============================================================

function renderShuttleSelect() {
    const select = document.getElementById('shuttleType');
    if (!select) return;
    select.innerHTML = '';
    shuttleTypes.forEach(shuttle => {
        const option = document.createElement('option');
        option.value = shuttle.id;
        option.textContent = `${shuttle.name} ($${shuttle.pricePerTube}/tube)`;
        select.appendChild(option);
    });
    updateShuttleCost();
}

function updateShuttleCost() {
    const select = document.getElementById('shuttleType');
    const display = document.getElementById('shuttleCostDisplay');
    if (!select || !display) return;
    const selectedId = select.value;
    const shuttle = shuttleTypes.find(s => s.id === selectedId);
    if (shuttle) {
        display.textContent = (shuttle.pricePerTube / 12).toFixed(2);
    }
}

function renderShuttleList() {
    const container = document.getElementById('shuttleList');
    if (!container) return;
    if (shuttleTypes.length === 0) {
        container.innerHTML = '<p style="color: #7f8c8d;">No shuttle types added yet.</p>';
        return;
    }
    container.innerHTML = '';
    shuttleTypes.forEach(shuttle => {
        const div = document.createElement('div');
        div.className = 'shuttle-item';
        div.innerHTML = `
            <span class="shuttle-name">${escapeHtml(shuttle.name)}</span>
            <span class="shuttle-price">$${shuttle.pricePerTube}/tube</span>
            <span class="shuttle-per-shuttle">($${(shuttle.pricePerTube/12).toFixed(2)}/shuttle)</span>
            <button class="btn btn-danger btn-xs" onclick="deleteShuttleType('${shuttle.id}')">✕</button>
        `;
        container.appendChild(div);
    });
}

function showAddShuttleModal() {
    document.getElementById('shuttleModal').classList.add('active');
    document.getElementById('newShuttleName').value = '';
    document.getElementById('newShuttlePrice').value = '';
    document.getElementById('shuttleModalMessage').className = 'message';
    document.getElementById('shuttleModalMessage').style.display = 'none';
}

function closeShuttleModal() {
    document.getElementById('shuttleModal').classList.remove('active');
}

function addShuttleType() {
    const name = document.getElementById('newShuttleName').value.trim();
    const price = parseFloat(document.getElementById('newShuttlePrice').value);
    
    if (!name) {
        showMessage('shuttleModalMessage', 'Please enter a shuttle name.', 'error');
        return;
    }
    if (!price || price <= 0) {
        showMessage('shuttleModalMessage', 'Please enter a valid price.', 'error');
        return;
    }
    
    if (shuttleTypes.some(s => s.name.toLowerCase() === name.toLowerCase())) {
        showMessage('shuttleModalMessage', 'A shuttle with this name already exists.', 'error');
        return;
    }
    
    shuttleTypes.push({
        id: generateId(),
        name: name,
        pricePerTube: price
    });
    
    saveData();
    renderShuttleSelect();
    renderShuttleList();
    closeShuttleModal();
    showMessage('saveMessage', `✅ Added "${name}" ($${price}/tube)`, 'success');
}

function deleteShuttleType(id) {
    const shuttle = shuttleTypes.find(s => s.id === id);
    if (!shuttle) return;
    const usedInEvents = events.some(e => e.shuttleTypeId === id);
    if (usedInEvents) {
        if (!confirm(`"${shuttle.name}" is used in existing events. Delete anyway?`)) return;
    }
    if (!confirm(`Delete "${shuttle.name}"?`)) return;
    
    shuttleTypes = shuttleTypes.filter(s => s.id !== id);
    saveData();
    renderShuttleSelect();
    renderShuttleList();
    if (shuttleTypes.length > 0) {
        document.getElementById('shuttleType').value = shuttleTypes[0].id;
    }
    updateShuttleCost();
}

// ============================================================
// TAB 1: INPUT
// ============================================================

function renderParticipantList(filterText = '') {
    const container = document.getElementById('participantList');
    if (!container) return;
    container.innerHTML = '';
    
    let visibleCount = 0;
    const searchTerm = filterText.toLowerCase().trim();
    
    participants.forEach((name, index) => {
        const nameLower = name.toLowerCase();
        const matches = !searchTerm || nameLower.includes(searchTerm);
        
        const div = document.createElement('div');
        div.className = 'participant-item' + (matches ? '' : ' hidden');
        div.id = `participant_${index}`;
        
        let displayName = escapeHtml(name);
        if (searchTerm && nameLower.includes(searchTerm)) {
            const idx = nameLower.indexOf(searchTerm);
            const before = escapeHtml(name.substring(0, idx));
            const match = escapeHtml(name.substring(idx, idx + searchTerm.length));
            const after = escapeHtml(name.substring(idx + searchTerm.length));
            displayName = before + `<span class="match-highlight">${match}</span>` + after;
        }
        
        div.innerHTML = `
            <span class="name">${displayName}</span>
            <select id="status_${index}" onchange="updateStatusBadge(${index})">
                <option value="">❌ Not attending</option>
                <option value="v">✅ Paid</option>
                <option value="x">❌ Unpaid</option>
                <option value="o">🏸 Venue only</option>
            </select>
            <span class="status-badge" id="badge_${index}"></span>
            <button class="remove-btn" onclick="removeParticipant(${index})" title="Remove participant">✕</button>
        `;
        container.appendChild(div);
        
        if (matches) visibleCount++;
    });
    
    document.getElementById('visibleCount').textContent = visibleCount;
    document.getElementById('totalCount').textContent = participants.length;
    document.getElementById('clearSearch').classList.toggle('visible', searchTerm.length > 0);
}

function filterParticipants() {
    const searchInput = document.getElementById('participantSearch');
    renderParticipantList(searchInput.value);
}

function clearSearch() {
    document.getElementById('participantSearch').value = '';
    renderParticipantList('');
    document.getElementById('participantSearch').focus();
}

function updateStatusBadge(index) {
    const select = document.getElementById(`status_${index}`);
    const badge = document.getElementById(`badge_${index}`);
    if (!select || !badge) return;
    
    const status = select.value;
    const statusText = {
        'v': '✅ Paid',
        'x': '❌ Unpaid',
        'o': '🏸 Venue'
    }[status] || '';
    
    const statusClass = {
        'v': 'paid',
        'x': 'unpaid',
        'o': 'venue'
    }[status] || '';
    
    badge.textContent = statusText;
    badge.className = 'status-badge ' + statusClass;
}

function setAllStatus(status) {
    const selects = document.querySelectorAll('#participantList select');
    selects.forEach((select, index) => {
        select.value = status;
        updateStatusBadge(index);
    });
}

function toggleSelectAll() {
    const visibleItems = document.querySelectorAll('#participantList .participant-item:not(.hidden) select');
    const allSelected = Array.from(visibleItems).every(s => s.value !== '');
    
    visibleItems.forEach((select, index) => {
        const item = select.closest('.participant-item');
        const globalIndex = Array.from(document.querySelectorAll('#participantList .participant-item')).indexOf(item);
        if (allSelected) {
            select.value = '';
        } else {
            select.value = 'v';
        }
        updateStatusBadge(globalIndex);
    });
}

function addParticipant() {
    const name = prompt('Enter participant name:');
    if (name && name.trim()) {
        if (participants.includes(name.trim())) {
            alert('Participant already exists!');
            return;
        }
        participants.push(name.trim());
        saveData();
        renderParticipantList(document.getElementById('participantSearch').value);
        renderSettings();
        if (isFirebaseConnected) syncToCloud();
    }
}

function addMultipleParticipants() {
    const names = prompt('Enter participant names (one per line):');
    if (names) {
        const list = names.split('\n').map(s => s.trim()).filter(s => s);
        let added = 0;
        list.forEach(name => {
            if (!participants.includes(name)) {
                participants.push(name);
                added++;
            }
        });
        if (added > 0) {
            saveData();
            renderParticipantList(document.getElementById('participantSearch').value);
            renderSettings();
            alert(`Added ${added} new participants!`);
            if (isFirebaseConnected) syncToCloud();
        } else {
            alert('No new participants added.');
        }
    }
}

function removeParticipant(index) {
    if (confirm(`Remove "${participants[index]}" from the list?`)) {
        participants.splice(index, 1);
        saveData();
        renderParticipantList(document.getElementById('participantSearch').value);
        renderSettings();
        if (isFirebaseConnected) syncToCloud();
    }
}

function getSelectedParticipants() {
    const result = [];
    document.querySelectorAll('#participantList select').forEach((select, index) => {
        const status = select.value;
        if (status) {
            result.push({
                name: participants[index],
                status: status,
                category: getCategory(participants[index])
            });
        }
    });
    return result;
}

// ============================================================
// SAVE / LOAD EVENTS
// ============================================================

function saveEvent() {
    const date = document.getElementById('eventDate').value;
    if (!date) {
        showMessage('saveMessage', 'Please select a date!', 'error');
        return;
    }
    
    const shuttleTypeId = document.getElementById('shuttleType').value;
    const shuttle = shuttleTypes.find(s => s.id === shuttleTypeId);
    if (!shuttle) {
        showMessage('saveMessage', 'Please select a shuttle type!', 'error');
        return;
    }
    
    const shuttlesUsed = parseInt(document.getElementById('shuttlesUsed').value) || 0;
    const venueCost = parseFloat(document.getElementById('venueCost').value) || 17;
    const taxiCost = parseFloat(document.getElementById('taxiCost').value) || 0;
    const actualFee = parseFloat(document.getElementById('actualFee').value) || 0;
    const taxiExcluded = document.getElementById('taxiExcluded').value.split(',').map(s => s.trim()).filter(s => s);
    
    const selectedParticipants = getSelectedParticipants();
    if (selectedParticipants.length === 0) {
        showMessage('saveMessage', 'Please select at least one participant!', 'error');
        return;
    }
    
    const shuttleCostPerShuttle = shuttle.pricePerTube / 12;
    const totalShuttleCost = shuttlesUsed * shuttleCostPerShuttle;
    const totalVenueCost = selectedParticipants.length * venueCost;
    const totalCost = totalShuttleCost + totalVenueCost;
    const costPerHead = selectedParticipants.length > 0 ? totalCost / selectedParticipants.length : 0;
    
    const taxiParticipants = selectedParticipants.filter(p => !taxiExcluded.includes(p.name));
    const taxiPerHead = taxiParticipants.length > 0 && taxiCost > 0 ? taxiCost / taxiParticipants.length : 0;
    
    const event = {
        id: date,
        date: date,
        shuttleTypeId: shuttleTypeId,
        shuttleName: shuttle.name,
        shuttlePrice: shuttle.pricePerTube,
        shuttlesUsed: shuttlesUsed,
        shuttleCostPerShuttle: shuttleCostPerShuttle,
        venueCost: venueCost,
        taxiCost: taxiCost,
        actualFee: actualFee,
        taxiExcluded: taxiExcluded,
        participants: selectedParticipants,
        totalCost: totalCost,
        costPerHead: costPerHead,
        taxiPerHead: taxiPerHead,
        totalWithTaxi: totalCost + taxiCost,
        totalParticipants: selectedParticipants.length
    };
    
    const existingIndex = events.findIndex(e => e.id === date);
    if (existingIndex >= 0) {
        if (!confirm(`Event on ${date} already exists. Overwrite?`)) return;
        events[existingIndex] = event;
    } else {
        events.push(event);
    }
    
    saveData();
    showMessage('saveMessage', `✅ Event on ${date} saved successfully!`, 'success');
    editingEventId = null;
    renderEvents();
    
    if (isFirebaseConnected) {
        setTimeout(() => syncToCloud(), 500);
    }
}

function loadEvent() {
    const date = prompt('Enter date to load (YYYY-MM-DD):');
    if (!date) return;
    const event = events.find(e => e.id === date);
    if (!event) {
        alert('Event not found!');
        return;
    }
    editEvent(date);
}

function editEvent(date) {
    const event = events.find(e => e.id === date);
    if (!event) return;
    
    editingEventId = date;
    document.getElementById('eventDate').value = event.date;
    
    const select = document.getElementById('shuttleType');
    if (event.shuttleTypeId) {
        select.value = event.shuttleTypeId;
    } else {
        const legacyShuttle = shuttleTypes.find(s => s.pricePerTube === event.shuttlePrice);
        if (legacyShuttle) select.value = legacyShuttle.id;
    }
    updateShuttleCost();
    
    document.getElementById('shuttlesUsed').value = event.shuttlesUsed;
    document.getElementById('venueCost').value = event.venueCost;
    document.getElementById('taxiCost').value = event.taxiCost || 0;
    document.getElementById('actualFee').value = event.actualFee || 0;
    document.getElementById('taxiExcluded').value = event.taxiExcluded ? event.taxiExcluded.join(', ') : '';
    
    renderParticipantList('');
    event.participants.forEach(p => {
        const index = participants.indexOf(p.name);
        if (index >= 0) {
            const select = document.getElementById(`status_${index}`);
            if (select) {
                select.value = p.status;
                updateStatusBadge(index);
            }
        }
    });
    
    showTab('input');
    document.getElementById('saveMessage').className = 'message';
    document.getElementById('saveMessage').style.display = 'none';
}

function deleteEvent(date) {
    if (confirm(`Delete event on ${date}? This cannot be undone.`)) {
        events = events.filter(e => e.id !== date);
        saveData();
        renderEvents();
        renderParticipantSummary();
        renderEarnings();
        if (isFirebaseConnected) syncToCloud();
    }
}

function clearForm() {
    if (confirm('Clear the form? Unsaved data will be lost.')) {
        document.getElementById('eventDate').value = getToday();
        document.getElementById('shuttlesUsed').value = 14;
        document.getElementById('taxiCost').value = 0;
        document.getElementById('actualFee').value = 50;
        document.getElementById('taxiExcluded').value = '';
        document.getElementById('participantSearch').value = '';
        renderParticipantList('');
        editingEventId = null;
        document.getElementById('saveMessage').className = 'message';
        document.getElementById('saveMessage').style.display = 'none';
    }
}

// ============================================================
// TAB 2: EVENTS
// ============================================================

function renderEvents() {
    const container = document.getElementById('eventsTableContainer');
    if (!container) return;
    
    if (events.length === 0) {
        container.innerHTML = '<p style="text-align: center; padding: 40px; color: #7f8c8d;">No events recorded yet. Start by adding an event!</p>';
        document.getElementById('eventsSummary').innerHTML = '';
        return;
    }
    
    const sortedEvents = [...events].sort((a, b) => new Date(b.date) - new Date(a.date));
    
    let html = `
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Participants</th>
                        <th>Paid</th>
                        <th>Shuttle</th>
                        <th>Shuttles</th>
                        <th>Cost/Head</th>
                        <th>Taxi/Head</th>
                        <th>Total Cost</th>
                        <th>Actual Fee</th>
                        <th class="no-print">Actions</th>
                    </tr>
                </thead>
                <tbody>
    `;
    
    sortedEvents.forEach(event => {
        const paidCount = event.participants.filter(p => p.status === 'v').length;
        const totalCount = event.participants.length;
        const totalCost = event.totalCost + (event.taxiCost || 0);
        const fee = event.actualFee || 0;
        
        html += `
            <tr>
                <td><strong>${formatDate(event.date)}</strong></td>
                <td>${totalCount}</td>
                <td><span class="badge badge-paid">${paidCount}</span></td>
                <td><span class="badge badge-info">${escapeHtml(event.shuttleName || 'Unknown')}</span></td>
                <td>${event.shuttlesUsed}</td>
                <td>$${event.costPerHead ? event.costPerHead.toFixed(2) : '0.00'}</td>
                <td>$${event.taxiPerHead ? event.taxiPerHead.toFixed(2) : '0.00'}</td>
                <td>$${totalCost.toFixed(2)}</td>
                <td>$${fee.toFixed(2)}</td>
                <td class="no-print">
                    <button class="btn btn-warning btn-sm" onclick="editEvent('${event.id}')">✏️</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteEvent('${event.id}')">🗑️</button>
                </td>
            </tr>
        `;
    });
    
    html += '</tbody></table></div>';
    container.innerHTML = html;
    updateEventsSummary();
}

function updateEventsSummary() {
    const container = document.getElementById('eventsSummary');
    if (!container) return;
    
    if (events.length === 0) {
        container.innerHTML = '';
        return;
    }
    
    const totalEvents = events.length;
    const totalParticipants = events.reduce((sum, e) => sum + e.participants.length, 0);
    const totalCost = events.reduce((sum, e) => sum + e.totalCost + (e.taxiCost || 0), 0);
    const totalCollected = events.reduce((sum, e) => {
        const paid = e.participants.filter(p => p.status === 'v').length;
        return sum + (paid * (e.actualFee || 0));
    }, 0);
    const totalUnpaid = events.reduce((sum, e) => {
        return sum + e.participants.filter(p => p.status === 'x' || p.status === 'o').length;
    }, 0);
    
    container.innerHTML = `
        <div class="summary-box">
            <h3>📈 Summary</h3>
            <div class="summary-grid">
                <div class="summary-item">
                    <div class="number">${totalEvents}</div>
                    <div class="label">Total Events</div>
                </div>
                <div class="summary-item">
                    <div class="number">${totalParticipants}</div>
                    <div class="label">Total Sessions</div>
                </div>
                <div class="summary-item">
                    <div class="number">${totalUnpaid}</div>
                    <div class="label">Unpaid Sessions</div>
                </div>
                <div class="summary-item">
                    <div class="number">$${totalCost.toFixed(2)}</div>
                    <div class="label">Total Cost</div>
                </div>
                <div class="summary-item">
                    <div class="number">$${totalCollected.toFixed(2)}</div>
                    <div class="label">Total Collected</div>
                </div>
                <div class="summary-item">
                    <div class="number ${totalCollected - totalCost >= 0 ? 'positive' : 'negative'}">
                        $${(totalCollected - totalCost).toFixed(2)}
                    </div>
                    <div class="label">Net</div>
                </div>
            </div>
        </div>
    `;
}

// ============================================================
// TAB 3: PARTICIPANTS
// ============================================================

function renderParticipantSummary() {
    const container = document.getElementById('participantSummaryContainer');
    if (!container) return;
    
    const summary = {};
    participants.forEach(name => {
        summary[name] = {
            attended: 0,
            paid: 0,
            unpaid: 0,
            venueOnly: 0,
            totalOwed: 0,
            events: []
        };
    });
    
    events.forEach(event => {
        event.participants.forEach(p => {
            if (summary[p.name]) {
                summary[p.name].attended++;
                if (p.status === 'v') {
                    summary[p.name].paid++;
                } else if (p.status === 'x') {
                    summary[p.name].unpaid++;
                    // ✅ Use actualFee for unpaid participants
                    const cost = event.actualFee || event.costPerHead || 0;
                    summary[p.name].totalOwed += cost;
                    summary[p.name].events.push({ 
                        date: event.date, 
                        cost: cost, 
                        status: p.status,
                        actualFee: event.actualFee,
                        shuttle: event.shuttleName
                    });
                } else if (p.status === 'o') {
                    summary[p.name].venueOnly++;
                    const cost = event.venueCost || 0;
                    summary[p.name].totalOwed += cost;
                    summary[p.name].events.push({ 
                        date: event.date, 
                        cost: cost, 
                        status: p.status,
                        venueCost: event.venueCost,
                        shuttle: event.shuttleName
                    });
                }
            }
        });
    });
    
    const hasData = Object.values(summary).some(s => s.attended > 0 || s.totalOwed > 0);
    if (!hasData) {
        container.innerHTML = '<p style="text-align: center; padding: 40px; color: #7f8c8d;">No participant data yet.</p>';
        return;
    }
    
    let html = `
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Attended</th>
                        <th>✅ Paid</th>
                        <th>❌ Unpaid</th>
                        <th>🏸 Venue Only</th>
                        <th>Total Owed</th>
                        <th class="no-print">Actions</th>
                    </tr>
                </thead>
                <tbody>
    `;
    
    Object.keys(summary).sort().forEach(name => {
        const s = summary[name];
        if (s.attended > 0 || s.totalOwed > 0) {
            html += `
                <tr>
                    <td><strong>${escapeHtml(name)}</strong></td>
                    <td>${s.attended}</td>
                    <td><span class="badge badge-paid">${s.paid}</span></td>
                    <td><span class="badge badge-unpaid">${s.unpaid}</span></td>
                    <td><span class="badge badge-venue-only">${s.venueOnly}</span></td>
                    <td>$${s.totalOwed.toFixed(2)}</td>
                    <td class="no-print">
                        <button class="btn btn-info btn-sm" onclick="showParticipantDetails('${name}')">📋</button>
                        ${s.totalOwed > 0 ? `<button class="btn btn-success btn-sm" onclick="markParticipantPaid('${name}')">✅</button>` : ''}
                    </td>
                </tr>
            `;
        }
    });
    
    html += '</tbody></table></div>';
    container.innerHTML = html;
}

function showParticipantDetails(name) {
    let details = `<h3>📋 ${escapeHtml(name)}'s Attendance</h3>`;
    details += `<table><thead><tr><th>Date</th><th>Shuttle</th><th>Status</th><th>Amount</th></tr></thead><tbody>`;
    
    let total = 0;
    events.sort((a, b) => new Date(a.date) - new Date(b.date)).forEach(event => {
        const p = event.participants.find(p => p.name === name);
        if (p) {
            let amount = 0;
            let statusText = '';
            if (p.status === 'v') {
                statusText = '✅ Paid';
                amount = event.actualFee || 0;
            } else if (p.status === 'x') {
                statusText = '❌ Unpaid';
                // ✅ Use actualFee for unpaid
                amount = event.actualFee || event.costPerHead || 0;
                total += amount;
            } else if (p.status === 'o') {
                statusText = '🏸 Venue Only';
                amount = event.venueCost || 0;
                total += amount;
            }
            details += `<tr><td>${formatDate(event.date)}</td><td>${escapeHtml(event.shuttleName || 'N/A')}</td><td>${statusText}</td><td>$${amount.toFixed(2)}</td></tr>`;
        }
    });
    
    details += `<tr style="font-weight: bold; background: #ecf0f1;"><td colspan="3">Total Owed</td><td>$${total.toFixed(2)}</td></tr>`;
    details += '</tbody></table>';
    
    const win = window.open('', '_blank', 'width=600,height=500');
    win.document.write(`<style>body{font-family:Arial;padding:20px;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #ddd;padding:8px;text-align:left;}th{background:#2c3e50;color:white;}</style>${details}`);
    win.document.close();
}

function markParticipantPaid(name) {
    if (!confirm(`Mark all events for ${name} as paid?`)) return;
    
    let count = 0;
    events.forEach(event => {
        const p = event.participants.find(p => p.name === name);
        if (p && (p.status === 'x' || p.status === 'o')) {
            p.status = 'v';
            count++;
        }
    });
    
    if (count > 0) {
        saveData();
        renderParticipantSummary();
        renderEvents();
        renderEarnings();
        if (isFirebaseConnected) syncToCloud();
        alert(`✅ ${name} marked as paid for ${count} event(s)!`);
    } else {
        alert(`${name} has no outstanding payments.`);
    }
}

function markAllPaid() {
    if (!confirm('Mark ALL participants as paid for ALL events? This cannot be undone easily.')) return;
    
    let count = 0;
    events.forEach(event => {
        event.participants.forEach(p => {
            if (p.status === 'x' || p.status === 'o') {
                p.status = 'v';
                count++;
            }
        });
    });
    
    if (count > 0) {
        saveData();
        renderParticipantSummary();
        renderEvents();
        renderEarnings();
        if (isFirebaseConnected) syncToCloud();
        alert(`✅ Marked ${count} unpaid sessions as paid!`);
    } else {
        alert('No unpaid sessions found.');
    }
}

// TAB 4: EARNINGS - FIXED ✅
// ============================================================

function renderEarnings() {
    const container = document.getElementById('earningsContainer');
    if (!container) return;
    
    if (events.length === 0) {
        container.innerHTML = '<p style="text-align: center; padding: 40px; color: #7f8c8d;">No events to analyze earnings.</p>';
        return;
    }
    
    let totalCost = 0;
    let totalCollected = 0;
    let totalUnpaid = 0;
    const earningsByEvent = [];
    
    const sortedEvents = [...events].sort((a, b) => new Date(a.date) - new Date(b.date));
    
    sortedEvents.forEach(event => {
        // ✅ FIXED: Filter out Bonnie and Donald from ALL calculations
        const nonBD = event.participants.filter(p => p.name !== 'Bonnie' && p.name !== 'Donald');
        
        // Paying participants (non-BD and status 'v')
        const payingParticipants = nonBD.filter(p => p.status === 'v');
        // Unpaid participants (non-BD and status 'x' or 'o')
        const unpaidParticipants = nonBD.filter(p => p.status === 'x' || p.status === 'o');
        
        // Calculate cost for non-Bonnie/Donald participants only
        const baseCostPerHead = event.costPerHead || 0;
        const taxiPerHead = event.taxiPerHead || 0;
        const taxiExcluded = event.taxiExcluded || [];
        
        let eventCost = 0;
        nonBD.forEach(p => {
            let cost = baseCostPerHead;
            // Add taxi if not excluded and taxi cost exists
            if (event.taxiCost > 0 && !taxiExcluded.includes(p.name)) {
                cost += taxiPerHead;
            }
            eventCost += cost;
        });
        
        // Collected from paying participants (non-BD)
        const collected = payingParticipants.length * (event.actualFee || 0);
        
        // Unpaid amount (non-BD)
        const unpaidAmount = unpaidParticipants.reduce((sum, p) => {
            let cost = baseCostPerHead;
            if (event.taxiCost > 0 && !taxiExcluded.includes(p.name)) {
                cost += taxiPerHead;
            }
            return sum + cost;
        }, 0);
        
        totalCost += eventCost;
        totalCollected += collected;
        totalUnpaid += unpaidAmount;
        
        earningsByEvent.push({
            date: event.date,
            cost: eventCost,
            collected: collected,
            unpaid: unpaidAmount,
            net: collected - eventCost,
            participants: nonBD.length,
            paying: payingParticipants.length,
            unpaidCount: unpaidParticipants.length,
            fee: event.actualFee || 0,
            shuttle: event.shuttleName || 'N/A'
        });
    });
    
    let html = `
        <div class="summary-box">
            <h3>📊 Earnings Summary <small style="font-weight: normal; color: #7f8c8d;">(Excluding Bonnie & Donald)</small></h3>
            <div class="summary-grid">
                <div class="summary-item">
                    <div class="number">$${totalCost.toFixed(2)}</div>
                    <div class="label">Total Cost (Non-BD)</div>
                </div>
                <div class="summary-item">
                    <div class="number">$${totalCollected.toFixed(2)}</div>
                    <div class="label">Total Collected</div>
                </div>
                <div class="summary-item">
                    <div class="number">$${totalUnpaid.toFixed(2)}</div>
                    <div class="label">Total Unpaid</div>
                </div>
                <div class="summary-item">
                    <div class="number ${totalCollected - totalCost >= 0 ? 'positive' : 'negative'}">
                        $${(totalCollected - totalCost).toFixed(2)}
                    </div>
                    <div class="label">Net</div>
                </div>
            </div>
        </div>
        
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Shuttle</th>
                        <th>Non-BD</th>
                        <th>Paying</th>
                        <th>Unpaid</th>
                        <th>Fee/Person</th>
                        <th>Total Cost</th>
                        <th>Collected</th>
                        <th>Unpaid Amount</th>
                        <th>Net</th>
                    </tr>
                </thead>
                <tbody>
    `;
    
    earningsByEvent.forEach(e => {
        html += `
            <tr>
                <td>${formatDate(e.date)}</td>
                <td><span class="badge badge-info">${escapeHtml(e.shuttle)}</span></td>
                <td>${e.participants}</td>
                <td>${e.paying}</td>
                <td>${e.unpaidCount}</td>
                <td>$${e.fee.toFixed(2)}</td>
                <td>$${e.cost.toFixed(2)}</td>
                <td>$${e.collected.toFixed(2)}</td>
                <td>$${e.unpaid.toFixed(2)}</td>
                <td style="color: ${e.net >= 0 ? '#27ae60' : '#e74c3c'}; font-weight: bold;">
                    $${e.net.toFixed(2)}
                </td>
            </tr>
        `;
    });
    
    html += '</tbody></table></div>';
    container.innerHTML = html;
}

function resetParticipants() {
    if (!confirm('Reset participants to default list? This will remove any custom additions.')) return;
    participants = DEFAULT_PARTICIPANTS.slice();
    saveData();
    renderSettings();
    renderParticipantList(document.getElementById('participantSearch').value);
    renderParticipantSummary();
    if (isFirebaseConnected) syncToCloud();
    alert('Participants reset to default!');
}

function clearAllData() {
    if (!confirm('⚠️ Delete ALL data? This includes all events, participant records, and shuttle types. This cannot be undone!')) return;

    events = [];
    participants = DEFAULT_PARTICIPANTS.slice();
    shuttleTypes = DEFAULT_SHUTTLE_TYPES.slice();
    saveData();
    renderEvents();
    renderParticipantSummary();
    renderEarnings();
    renderSettings();
    renderParticipantList('');
    renderShuttleSelect();
    if (isFirebaseConnected) syncToCloud();

}

// ============================================================
// DATA EXPORT / IMPORT
// ============================================================

function exportData() {
    const data = {
        version: '2.0',
        exportedAt: new Date().toISOString(),
        participants: participants,
        events: events,
        shuttleTypes: shuttleTypes
    };
    
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `badminton_data_${getToday()}.json`;
    a.click();
    URL.revokeObjectURL(url);
}

function importData() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            try {
                const data = JSON.parse(event.target.result);
                if (data.participants && data.events) {
                    if (!confirm(`Import ${data.events.length} events, ${data.participants.length} participants, and ${data.shuttleTypes ? data.shuttleTypes.length : 0} shuttle types? This will replace current data.`)) return;
                    participants = data.participants;
                    events = data.events;
                    shuttleTypes = data.shuttleTypes || DEFAULT_SHUTTLE_TYPES.slice();
                    saveData();
                    renderEvents();
                    renderParticipantSummary();
                    renderEarnings();
                    renderSettings();
                    renderParticipantList('');
                    renderShuttleSelect();
                    if (isFirebaseConnected) syncToCloud();
                    alert('✅ Data imported successfully!');
                } else {
                    alert('Invalid data format!');
                }
            } catch (err) {
                alert('Error reading file: ' + err.message);
            }
        };
        reader.readAsText(file);
    };
    input.click();
}

// ============================================================
// INITIALIZATION
// ============================================================

function init() {
    loadData();
    document.getElementById('eventDate').value = getToday();
    renderShuttleSelect();
    document.getElementById('shuttleType').addEventListener('change', updateShuttleCost);
    renderParticipantList('');
    renderEvents();
    renderParticipantSummary();
    renderEarnings();
    renderSettings();
    
    const savedConfig = loadFirebaseConfig();
    if (savedConfig) {
        setTimeout(() => configureFirebase(), 500);
    }
}

document.addEventListener('DOMContentLoaded', init);
